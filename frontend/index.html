<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CINE_MATRIX // Premium Vector Exploration Engine</title>
    <!-- Tailwind CSS Engine Core -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --font-sans: 'Inter', sans-serif;
            --font-display: 'Space Grotesk', sans-serif;
        }
        body {
            font-family: var(--font-sans);
            background: #030712;
            overflow-x: hidden;
        }
        .font-display { font-family: var(--font-display); }
        
        /* Premium Background Mesh */
        .ambient-glow {
            position: fixed;
            width: 80vw;
            height: 80vw;
            top: -40vw;
            right: -20vw;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(244, 63, 94, 0.03) 50%, transparent 100%);
            z-index: 0;
            pointer-events: none;
        }

        /* Advanced Micro-Interactions & Glassmorphism */
        .premium-glass {
            background: rgba(17, 24, 39, 0.5);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4);
        }
        .search-glass {
            background: rgba(31, 41, 55, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .search-glass:focus-within {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        /* Movie Card Kinetic Acceleration */
        .kinetic-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, box-shadow;
        }
        .kinetic-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.35);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7), 0 0 30px rgba(99, 102, 241, 0.1);
        }
        .kinetic-card::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            opacity: 0;
            background: linear-gradient(to top, rgba(99, 102, 241, 0.15), transparent);
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        .kinetic-card:hover::after {
            opacity: 1;
        }

        /* Custom Modern Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }

        /* Shimmer Skeleton System Loading Animation */
        .shimmer {
            background: linear-gradient(90deg, #111827 25%, #1f2937 50%, #111827 75%);
            background-size: 200% 100%;
            animation: loading-shimmer 1.6s infinite linear;
        }
        @keyframes loading-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="text-slate-200 antialiased relative min-h-screen">
    <div class="ambient-glow"></div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 py-12">
        <!-- Ultimate Header Interface -->
        <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-8 mb-16 border-b border-slate-900 pb-10">
            <div>
                <div class="flex flex-wrap items-center gap-4 mb-2">
                    <div class="flex items-center gap-3">
                        <span class="h-2 w-2 rounded-full bg-indigo-500 animate-ping"></span>
                        <span class="font-display font-bold tracking-widest text-xs text-indigo-400 uppercase">Vector Space Processing Node v3.0</span>
                    </div>
                    
                    <!-- ADDED: Premium Home Button Action Trigger -->
                    <button onclick="goHome()" class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-900/80 border border-slate-800 text-[11px] font-mono uppercase tracking-wider text-slate-400 hover:text-white hover:border-indigo-500/50 transition-all duration-300 active:scale-95">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-3.5 h-3.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
                        </svg>
                        Reset Matrix // Home
                    </button>
                </div>
                
                <h1 class="font-display font-bold text-5xl md:text-6xl tracking-tight bg-gradient-to-tr from-white via-slate-200 to-slate-500 bg-clip-text text-transparent cursor-pointer select-none" onclick="goHome()">
                    CINE<span class="text-indigo-500">_</span>MATRIX
                </h1>
                <p class="text-slate-400 mt-3 text-sm md:text-base max-w-xl font-light leading-relaxed">
                    A highly optimized latent space semantic analysis engine. Query dimensional metrics across clustered multi-million data points instantly.
                </p>
            </div>
            
            <!-- Sleek Unified Search Input Block -->
            <div class="w-full lg:w-[420px]">
                <div class="search-glass flex items-center p-1.5 rounded-2xl group transition-all duration-300">
                    <input id="searchInput" type="text" placeholder="Trace an index (e.g., Interstellar)..." 
                           class="w-full bg-transparent px-4 py-3 text-sm font-medium text-slate-100 placeholder-slate-500 focus:outline-none">
                    <button onclick="getRecommendations()" 
                            class="px-6 py-3 font-display text-sm font-bold tracking-wider uppercase bg-white text-black hover:bg-indigo-500 hover:text-white rounded-xl shadow-xl transition-all duration-300 active:scale-95">
                        Query
                    </button>
                </div>
            </div>
        </header>

        <!-- Dynamic Skeletal Grid System Container -->
        <div id="skeletonLoader" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 mb-16">
            <div class="rounded-2xl overflow-hidden aspect-[2/3] shimmer"></div>
            <div class="rounded-2xl overflow-hidden aspect-[2/3] shimmer"></div>
            <div class="rounded-2xl overflow-hidden aspect-[2/3] shimmer animate-[loading-shimmer_1.6s_infinite_0.2s_linear]"></div>
            <div class="rounded-2xl overflow-hidden aspect-[2/3] shimmer animate-[loading-shimmer_1.6s_infinite_0.4s_linear]"></div>
            <div class="rounded-2xl overflow-hidden aspect-[2/3] shimmer animate-[loading-shimmer_1.6s_infinite_0.6s_linear]"></div>
        </div>

        <!-- Section: Interactive Query Output Map -->
        <section id="searchSection" class="hidden mb-20">
            <div id="searchedMovieContainer" class="mb-12 p-8 rounded-3xl premium-glass flex flex-col md:flex-row gap-8 items-center md:items-start relative overflow-hidden group">
                <!-- Anchor item will layout dynamically inside this element block -->
            </div>
            
            <div class="flex items-center gap-3 mb-8">
                <div class="h-[1px] flex-1 bg-gradient-to-r from-indigo-500/30 to-transparent"></div>
                <h2 class="font-display font-bold text-lg text-indigo-400 uppercase tracking-widest px-4">Calculated Nearest Neighbors</h2>
                <div class="h-[1px] flex-1 bg-gradient-to-l from-indigo-500/30 to-transparent"></div>
            </div>
            <div id="recommendationsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Nearest neighbor response arrays -->
            </div>
        </section>

        <!-- Section: Premium Dynamic Curated Layer Collections -->
        <section id="curationSection" class="relative">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-6 mb-8">
                <div class="flex items-center gap-4 bg-slate-950/80 p-1.5 rounded-2xl border border-slate-900 w-fit">
                    <button id="defaultTabButton" onclick="loadCuration('trending', this)" class="curation-tab font-display text-xs font-bold uppercase tracking-wider px-5 py-3 rounded-xl transition-all duration-300 bg-white text-black">Trending</button>
                    <button onclick="loadCuration('highly_rated', this)" class="curation-tab font-display text-xs font-bold uppercase tracking-wider px-5 py-3 rounded-xl transition-all duration-300 text-slate-400 hover:text-slate-200">Highly Rated</button>
                    <button onclick="loadCuration('classics', this)" class="curation-tab font-display text-xs font-bold uppercase tracking-wider px-5 py-3 rounded-xl transition-all duration-300 text-slate-400 hover:text-slate-200">Classics</button>
                    <button onclick="loadCuration('epics', this)" class="curation-tab font-display text-xs font-bold uppercase tracking-wider px-5 py-3 rounded-xl transition-all duration-300 text-slate-400 hover:text-slate-200">Epics</button>
                </div>
                <span class="text-xs text-slate-500 font-mono hidden md:inline-block">Status: Data Clusters Operational</span>
            </div>

            <div id="curationGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Curation arrays -->
            </div>
        </section>
    </div>

    <!-- UI/UX Runtime Integration Logic -->
    <script>
        const BASE_URL = 'https://movie-recommendetion-ilfv.onrender.com';
        const FALLBACK_POSTER = 'https://images.unsplash.com/photo-1485846234645-a62644f84728?q=80&w=400&auto=format&fit=crop';

        // Advanced Dynamic Card Element Assembler
        function generateMovieCard(movie) {
            const poster = movie.poster || FALLBACK_POSTER;
            const rating = movie.rating ? movie.rating.toFixed(1) : '0.0';
            const year = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';

            return `
                <div class="kinetic-card premium-glass relative rounded-2xl overflow-hidden flex flex-col cursor-pointer group" 
                     onclick="searchSpecificMovie('${movie.title.replace(/'/g, "\\'")}')">
                    <div class="relative aspect-[2/3] bg-slate-950 overflow-hidden">
                        <img src="${poster}" alt="${movie.title}" class="w-full h-full object-cover grayscale-[20%] group-hover:grayscale-0 transition-all duration-700 ease-out transform group-hover:scale-105" loading="lazy">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-transparent to-transparent opacity-60"></div>
                        
                        <!-- Interactive Corner Badge -->
                        <div class="absolute top-3 right-3 px-2.5 py-1 rounded-xl bg-slate-950/90 text-[10px] font-bold font-mono text-amber-400 border border-amber-500/20 shadow-xl backdrop-blur-md">
                            ★ ${rating}
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-grow z-10">
                        <h3 class="font-display font-medium text-slate-200 text-sm md:text-base line-clamp-1 group-hover:text-white transition-colors duration-300">${movie.title}</h3>
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-900/50 text-[11px] font-mono text-slate-500 group-hover:text-slate-400 transition-colors">
                            <span>YEAR // ${year}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Handle Toggling of Global Skeletal Load State 
        function toggleLoading(show) {
            const skeleton = document.getElementById('skeletonLoader');
            if (show) {
                skeleton.classList.remove('hidden');
            } else {
                skeleton.classList.add('hidden');
            }
        }

        // ADDED: Reset execution to hide search queries and jump straight back to defaults
        function goHome() {
            document.getElementById('searchInput').value = '';
            const searchSection = document.getElementById('searchSection');
            searchSection.classList.add('hidden');
            
            const defaultTab = document.getElementById('defaultTabButton');
            if (defaultTab) {
                loadCuration('trending', defaultTab);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Fetch Pipeline Cluster API Layers
        async function loadCuration(filterType, tabElement) {
            const grid = document.getElementById('curationGrid');
            
            // Clean active tab CSS styling classes
            document.querySelectorAll('.curation-tab').forEach(tab => {
                tab.classList.remove('bg-white', 'text-black');
                tab.classList.add('text-slate-400', 'hover:text-slate-200');
            });
            tabElement.classList.remove('text-slate-400', 'hover:text-slate-200');
            tabElement.classList.add('bg-white', 'text-black');

            grid.innerHTML = '';
            toggleLoading(true);

            try {
                const response = await fetch(`${BASE_URL}/curations/${filterType}`);
                const data = await response.json();
                
                if (data.movies && data.movies.length > 0) {
                    grid.innerHTML = data.movies.map(movie => generateMovieCard(movie)).join('');
                } else {
                    grid.innerHTML = `<p class="col-span-full text-center text-slate-500 text-xs font-mono py-12">EMPTY_MATRIX_RESPONSE</p>`;
                }
            } catch (error) {
                console.error("Pipeline breakdown:", error);
                grid.innerHTML = `<p class="col-span-full text-center text-rose-400 text-xs font-mono py-12">ERROR_NODE_CONNECTION_FAILED</p>`;
            } finally {
                toggleLoading(false);
            }
        }

        // Vector Space Similarity Recommender Execution Array
        async function getRecommendations() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const searchSection = document.getElementById('searchSection');
            const searchedMovieContainer = document.getElementById('searchedMovieContainer');
            const recommendationsGrid = document.getElementById('recommendationsGrid');

            toggleLoading(true);
            
            try {
                const response = await fetch(`${BASE_URL}/recommend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: query })
                });

                if (!response.ok) throw new Error("Index target array missing");

                const data = await response.json();
                searchSection.classList.remove('hidden');

                // Render Input Primary Selection Card
                const target = data.searched_movie;
                const targetPoster = target.poster || FALLBACK_POSTER;
                const targetRating = target.rating ? target.rating.toFixed(1) : '0.0';
                
                searchedMovieContainer.innerHTML = `
                    <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                    <img src="${targetPoster}" alt="${target.title}" class="w-36 md:w-44 rounded-2xl shadow-2xl object-cover aspect-[2/3] bg-slate-900 border border-slate-800 z-10 transition-transform duration-500 group-hover:scale-[1.01]">
                    <div class="text-center md:text-left flex-1 z-10">
                        <div class="inline-block px-3 py-1 rounded-lg bg-indigo-500/10 border border-indigo-500/20 font-mono text-[10px] tracking-widest text-indigo-400 uppercase mb-3">
                            Target Identity Anchor
                        </div>
                        <h2 class="font-display font-bold text-3xl md:text-4xl text-white tracking-tight">${target.title}</h2>
                        <p class="text-slate-400 text-xs md:text-sm mt-4 leading-relaxed max-w-4xl font-light">${target.overview}</p>
                        <div class="flex items-center justify-center md:justify-start gap-6 mt-6 font-mono text-xs text-slate-500">
                            <span class="text-amber-400 font-semibold">★ ${targetRating} IMDB_METRIC</span>
                            <span>RLS_DATE // ${target.release_date}</span>
                        </div>
                    </div>
                `;

                // Render Latent Nearest Neighbor Structural Matrix Card Nodes
                if (data.recommendations && data.recommendations.length > 0) {
                    recommendationsGrid.innerHTML = data.recommendations.map(movie => generateMovieCard(movie)).join('');
                } else {
                    recommendationsGrid.innerHTML = `<p class="col-span-full text-center text-slate-500 font-mono text-xs">NO_PROXIMAL_VECTOR_NEIGHBORS</p>`;
                }

                searchSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

            } catch (error) {
                alert("Vector matrix address mismatch. This title is not registered inside your CSV dataset.");
                console.error(error);
            } finally {
                toggleLoading(false);
            }
        }

        // Tap Execution Mapper
        function searchSpecificMovie(title) {
            document.getElementById('searchInput').value = title;
            getRecommendations();
        }

        // Initialize Runtime Loop Cycle Stack
        document.addEventListener('DOMContentLoaded', () => {
            const defaultTab = document.getElementById('defaultTabButton');
            if (defaultTab) loadCuration('trending', defaultTab);
        });

        // Event Interceptor for layout typing ease
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') getRecommendations();
        });
    </script>
</body>
</html>
